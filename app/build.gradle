plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fexed.spacecadetpinball'
    compileSdk 35
    ndkVersion '25.2.9519653'

    defaultConfig {
        // Separate id so the RG Rotate fork installs alongside the original app.
        applicationId "com.liunev.spacecadetrgrotate"
        minSdk 21
        targetSdk 33
        versionCode 14
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            multiDexEnabled true
        }

        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            multiDexEnabled true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '4.1.2'
        }
    }

    defaultConfig.externalNativeBuild {
        cmake {
            // CMake 4 dropped support for the ancient minimum versions declared by SDL_mixer.
            // Newer clang rejects SDL 2.0.22's -Werror=declaration-after-statement; skip that check.
            arguments '-DCMAKE_POLICY_VERSION_MINIMUM=3.5', '-DHAVE_GCC_WDECLARATION_AFTER_STATEMENT=OFF'
        }
    }

    buildFeatures{
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'

        unitTests.all {
            useJUnitPlatform()
        }
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.volley:volley:1.2.1'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.test:core:1.5.0'
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.junit.jupiter:junit-jupiter-engine:5.7.1'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}